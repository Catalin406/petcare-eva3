# ============================================================
# /etc/nginx/sites-available/petcare  (enlazar en sites-enabled)
# Nginx termina el HTTPS (Let's Encrypt) y reenvía a Gunicorn.
# "include proxy_params" agrega Host, X-Real-IP, X-Forwarded-For y
# X-Forwarded-Proto: este último es el que Django usa (con
# DETRAS_DE_PROXY_HTTPS=True) para saber que la petición original era https.
# Si el certificado lo creó Certbot, él agrega/ajusta las líneas ssl_*.
# ============================================================
server {
    listen 80;
    server_name codelab-catalina.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name codelab-catalina.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/codelab-catalina.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codelab-catalina.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Exámenes: Django acepta hasta 5 MB por archivo; se deja margen para el formulario.
    client_max_body_size 8M;

    # Archivos estáticos (CSS/JS) generados con "collectstatic". Son públicos.
    location /static/ {
        alias /home/ubuntu/petcare-eva3/staticfiles/;
        expires 7d;
    }

    # IMPORTANTE: fotos de mascotas y exámenes son DATOS CLÍNICOS.
    # Viven en /home/ubuntu/petcare-eva3/archivos_privados/ y Django los entrega
    # solo con login y permisos. Nginx NO debe tener ningún "location" ni "alias"
    # hacia esa carpeta; estos bloques lo dejan explícito.
    location ^~ /archivos_privados/ { return 404; }
    location ^~ /media/             { return 404; }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }
}
