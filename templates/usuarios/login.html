{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header text-center"><i class="bi bi-heart-pulse-fill"></i> Ingreso a {{ NOMBRE_COMERCIAL }}</div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                    <div class="alert alert-danger">Usuario o contraseña incorrectos. Revisa los datos e inténtalo de nuevo.</div>
                    {% endif %}
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Usuario</label>
                        <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autofocus autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" autocomplete="current-password" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
