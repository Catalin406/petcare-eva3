{% if is_paginated %}
<nav aria-label="Paginación" class="mt-3">
    <ul class="pagination justify-content-center mb-0">
        {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{{ consulta_sin_pagina }}page={{ page_obj.previous_page_number }}">&laquo;</a></li>{% endif %}
        <li class="page-item active"><span class="page-link">{{ page_obj.number }} de {{ paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{{ consulta_sin_pagina }}page={{ page_obj.next_page_number }}">&raquo;</a></li>{% endif %}
    </ul>
</nav>
{% endif %}
