{# Un campo de formulario con etiqueta, ayuda y errores claros junto al campo. #}
<div class="mb-3">
    {% if campo.field.widget.input_type == "checkbox" %}
    <div class="form-check">
        {{ campo }}
        <label class="form-check-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    </div>
    {% else %}
    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="text-principal">*</span>{% endif %}</label>
    {{ campo }}
    {% endif %}
    {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
    {% for error in campo.errors %}<div class="invalid-feedback d-block"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>{% endfor %}
</div>
