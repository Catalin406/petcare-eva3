{# Navbar provisoria: en la fase de interfaz se completa el menú por rol. #}
<nav class="navbar navbar-expand-lg navbar-academia">
    <div class="container">
        <a class="navbar-brand" href="{% url 'inicio' %}"><i class="bi bi-heart-pulse-fill"></i> {{ NOMBRE_COMERCIAL }}</a>
        {% if user.is_authenticated %}
        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="small text-secondary">{{ user.nombre_visible }} · {{ user.get_rol_display }}</span>
            {# El cierre de sesión es POST con CSRF: un enlace no puede cerrar la sesión. #}
            <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>
